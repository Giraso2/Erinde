<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practice Web Page</title>
    <style>
        /* ===== CSS ===== */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #4CAF50;
            color: white;
            padding: 20px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        section {
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        .highlight {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ===== HTML ===== -->
    <header>
        <h1>My Practice Web</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h2>Home Section</h2>
        <p id="text">Click the button below to change this text.</p>
        <button id="changeTextBtn">Change Text</button>
        <button id="colorBtn">Change Background</button>
    </section>

    <section id="about">
        <h2>About Section</h2>
        <p class="highlight">This is how CSS classes work.</p>
    </section>

    <section id="contact">
        <h2>Contact Section</h2>
        <p>Type something: <input type="text" id="inputText"></p>
        <button id="showInputBtn">Show Text Below</button>
        <p id="displayText"></p>
    </section>

    <!-- ===== JavaScript ===== -->
    <script>
        // Change paragraph text
        document.getElementById("changeTextBtn").addEventListener("click", function() {
            document.getElementById("text").innerText = "You changed the text!";
        });

        // Change background color
        document.getElementById("colorBtn").addEventListener("click", function() {
            document.body.style.backgroundColor = "#d0f0c0";
        });

        // Display input value
        document.getElementById("showInputBtn").addEventListener("click", function() {
            const input = document.getElementById("inputText").value;
            document.getElementById("displayText").innerText = "You typed: " + input;
        });
    </script>

</body>
</html>
