<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Erinde Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    background:#f4f6f9;
}

/* Sidebar */
.sidebar{
    width:230px;
    background:#1f2937;
    color:white;
    height:100vh;
    padding:20px;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    border-radius:6px;
}

.sidebar ul li:hover{
    background:#374151;
}

/* Main */
.main{
    flex:1;
    padding:25px;
}

.header{
    font-size:22px;
    margin-bottom:20px;
}

/* Cards */
.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:30px;
}

.card{
    padding:20px;
    color:white;
    border-radius:10px;
}

.card:nth-child(1){background:#3b82f6;}
.card:nth-child(2){background:#10b981;}
.card:nth-child(3){background:#f59e0b;}
.card:nth-child(4){background:#ef4444;}

.card h3{
    font-size:28px;
}

/* Tabs */
.tabs{
    margin-top:20px;
}

.tab-buttons{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.tab-buttons button{
    padding:10px 15px;
    border:none;
    background:#e5e7eb;
    cursor:pointer;
    border-radius:5px;
}

.tab-buttons button.active{
    background:#3b82f6;
    color:white;
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:8px;
    overflow:hidden;
}

th, td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f3f4f6;
}
</style>
</head>
<body>

<div class="sidebar">
    <h2>ERINDE</h2>
    <ul>
        <li>Dashboard</li>
        <li>Admin</li>
        <li>Users</li>
    </ul>
</div>

<div class="main">
    <div class="header">Admin Dashboard</div>

    <!-- Stats Cards -->
    <div class="cards">
        <div class="card">
            <p>Patients</p>
            <h3>120</h3>
        </div>
        <div class="card">
            <p>Hospitals</p>
            <h3>15</h3>
        </div>
        <div class="card">
            <p>Doctors</p>
            <h3>42</h3>
        </div>
        <div class="card">
            <p>Users</p>
            <h3>300</h3>
        </div>
    </div>

    <!-- Chart -->
    <canvas id="myChart" height="80"></canvas>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab-buttons">
            <button onclick="showTab('patients')" class="active">Patients</button>
            <button onclick="showTab('hospitals')">Hospitals</button>
            <button onclick="showTab('doctors')">Doctors</button>
        </div>

        <div id="patients" class="tab-content">
            <table>
                <tr><th>Name</th><th>Age</th><th>Status</th></tr>
                <tr><td>John Doe</td><td>45</td><td>Admitted</td></tr>
                <tr><td>Mary Ann</td><td>30</td><td>Discharged</td></tr>
            </table>
        </div>

        <div id="hospitals" class="tab-content" style="display:none;">
            <table>
                <tr><th>Name</th><th>Location</th></tr>
                <tr><td>City Hospital</td><td>New York</td></tr>
                <tr><td>Care Clinic</td><td>Chicago</td></tr>
            </table>
        </div>

        <div id="doctors" class="tab-content" style="display:none;">
            <table>
                <tr><th>Name</th><th>Speciality</th></tr>
                <tr><td>Dr Smith</td><td>Cardiology</td></tr>
                <tr><td>Dr James</td><td>Neurology</td></tr>
            </table>
        </div>
    </div>
</div>

<script>
function showTab(tabId){
    document.querySelectorAll(".tab-content").forEach(tab=>{
        tab.style.display="none";
    });

    document.querySelectorAll(".tab-buttons button").forEach(btn=>{
        btn.classList.remove("active");
    });

    document.getElementById(tabId).style.display="block";
    event.target.classList.add("active");
}

/* Chart */
new Chart(document.getElementById("myChart"), {
    type: 'line',
    data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun'],
        datasets: [{
            label: 'Patients Growth',
            data: [10,20,25,30,50,70],
            borderColor: '#3b82f6',
            fill: false
        }]
    }
});
</script>

</body>
</html>
